syntax = "proto3";

package tezcatl.v1;

option go_package = "github.com/bornholm/tezcatl/gen/tezcatl/v1;tezcatlv1";

message MarkTemplateRequest {
  string template = 1;
  // One of normal, ignore, symptomatic; empty clears the marking.
  string marking = 2;
}

message MarkTemplateResponse {}

message ListTemplatesRequest {}

message TemplateInfo {
  string partition = 1;
  int64 id = 2;
  string template = 3;
  int64 size = 4;
  string marking = 5;
}

message ListTemplatesResponse {
  repeated TemplateInfo templates = 1;
}

message ListMetricsRequest {}

message MetricInfo {
  // key is "source/metric{labels}".
  string key = 1;
  int64 samples = 2;
  double mean = 3;
  double std_dev = 4;
  // recent is the fast EWMA, the level of the latest samples.
  double recent = 5;
  // warmup is true while the series has too few samples for
  // statistical signals.
  bool warmup = 6;
  // ignored is true when a runtime marking silences this series.
  bool ignored = 7;
}

message MarkMetricRequest {
  // pattern is an exact series key ("source/metric{labels}"), an exact
  // metric name, or a path.Match glob over either.
  string pattern = 1;
  // ignore silences the matching series; false clears the marking.
  bool ignore = 2;
}

message MarkMetricResponse {}

message ListMetricsResponse {
  repeated MetricInfo metrics = 1;
}

message ForgetRequest {
  // pattern is a path.Match glob over partition names
  // ("production/session-*"); an exact name forgets one partition.
  string pattern = 1;
}

message ForgetResponse {
  // partitions names what was dropped.
  repeated string partitions = 1;
  // templates and series count what was learned about them.
  int32 templates = 2;
  int32 series = 3;
}

message StreamEventsRequest {
  // history is how many recent events to replay before live ones; 0
  // replays everything the server still holds.
  int32 history = 1;
}

// EventEnvelope carries an event in the same JSON form the stdout and
// webhook sinks emit. The event schema is nested and evolving, and that
// JSON is already the documented contract, so it is not restated field
// by field here.
message EventEnvelope {
  string json = 1;
  // ready marks the end of the replayed history: it carries no event,
  // and everything after it is live. It is sent even when there is no
  // history, so a client can tell "connected" from "still waiting".
  bool ready = 2;
}

message ListEventsRequest {
  // since and until bound the event timestamps, RFC3339; empty means
  // unbounded on that side.
  string since = 1;
  string until = 2;
  // limit keeps only the newest events; 0 applies the server default.
  int32 limit = 3;
}

message ListEventsResponse {
  // events come oldest first, one JSON document each, in the same form
  // the stdout sink emits.
  repeated EventEnvelope events = 1;
}

// AdminService is the runtime inspection and feedback loop: see what
// has been learned and mark templates without restarting the server.
service AdminService {
  rpc MarkTemplate(MarkTemplateRequest) returns (MarkTemplateResponse);
  rpc MarkMetric(MarkMetricRequest) returns (MarkMetricResponse);
  rpc Forget(ForgetRequest) returns (ForgetResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc ListMetrics(ListMetricsRequest) returns (ListMetricsResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream EventEnvelope);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
}
