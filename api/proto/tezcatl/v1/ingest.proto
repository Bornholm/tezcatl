syntax = "proto3";

package tezcatl.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/bornholm/tezcatl/gen/tezcatl/v1;tezcatlv1";

enum Modality {
  MODALITY_UNSPECIFIED = 0;
  MODALITY_LOG = 1;
  MODALITY_METRIC = 2;
  MODALITY_TRACE = 3;
  MODALITY_CHANGE = 4;
}

message LogRecord {
  string raw = 1;
  // message and level are for a source that already knows them, because
  // it read them from a structured feed rather than from a line of
  // text. Both are optional: left empty, the server falls back to
  // parsing raw. Filled, they are taken as given, which is how a source
  // keeps the knowledge of its own format out of the server.
  string message = 2;
  string level = 3;
}

message MetricSample {
  string name = 1;
  double value = 2;
  map<string, string> labels = 3;
}

message ChangeRecord {
  string type = 1;
  string version = 2;
  string summary = 3;
}

message Observation {
  string id = 1;
  string source = 2;
  Modality modality = 3;
  google.protobuf.Timestamp timestamp = 4;
  map<string, string> attributes = 5;

  LogRecord log = 6;
  MetricSample metric = 7;
  ChangeRecord change = 8;

  string service = 9;
  string environment = 10;
}

message StreamSummary {
  uint64 accepted = 1;
}

service IngestService {
  // Client-streaming ingestion: the server acknowledges the whole stream
  // once it is closed. Backpressure is exerted through HTTP/2 flow
  // control, the server only reading as fast as the pipeline absorbs.
  rpc StreamObservations(stream Observation) returns (StreamSummary);
}
