version: 2

before:
  hooks:
    - go mod tidy
    - sh -c "cd plugins/host && go mod tidy"
    - sh -c "cd plugins/kubernetes && go mod tidy"
    - sh -c "cd plugins/prometheus && go mod tidy"

builds:
  - id: tezcatl
    # Aucun cgo (postgres via pgx pur Go) : la cross-compilation vers
    # toutes les cibles first-class fonctionne sans toolchain natif.
    env:
      - CGO_ENABLED=0
    targets: [go_first_class]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./cmd/tezcatl
    binary: tezcatl
    flags:
      - -trimpath
    ldflags:
      - -w -s -X 'github.com/bornholm/tezcatl/internal/build.ShortVersion={{ .Version }}' -X 'github.com/bornholm/tezcatl/internal/build.LongVersion={{ .Version }} ({{ .Commit }})'

  # Plugin source « host » : module Go séparé (plugins/host), binaire
  # nommé selon la convention tezcatl-source-<name>.
  - id: tezcatl-source-host
    env:
      - CGO_ENABLED=0
    targets: [go_first_class]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./plugins/host
    binary: tezcatl-source-host
    flags:
      - -trimpath
    ldflags:
      - -w -s

  # Plugin source « kubernetes » : events du cluster et logs de pods
  # via l'API server.
  - id: tezcatl-source-kubernetes
    env:
      - CGO_ENABLED=0
    targets: [go_first_class]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./plugins/kubernetes
    binary: tezcatl-source-kubernetes
    flags:
      - -trimpath
    ldflags:
      - -w -s

  # Plugin source « prometheus » : requêtes PromQL périodiques via
  # l'API HTTP de Prometheus.
  - id: tezcatl-source-prometheus
    env:
      - CGO_ENABLED=0
    targets: [go_first_class]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./plugins/prometheus
    binary: tezcatl-source-prometheus
    flags:
      - -trimpath
    ldflags:
      - -w -s

archives:
  - id: tezcatl
    ids: [tezcatl]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - docs/ROADMAP.md
      - misc/config/standalone.yaml
      - misc/config/server.yaml

  # Archive séparée pour le plugin, au format attendu par
  # `tezcatl plugin install` (<name>_<version>_<os>_<arch>.tar.gz).
  - id: tezcatl-source-host
    ids: [tezcatl-source-host]
    name_template: "tezcatl-source-host_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - none*

  - id: tezcatl-source-kubernetes
    ids: [tezcatl-source-kubernetes]
    name_template: "tezcatl-source-kubernetes_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - none*

  - id: tezcatl-source-prometheus
    ids: [tezcatl-source-prometheus]
    name_template: "tezcatl-source-prometheus_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - none*

nfpms:
  # Paquet client : le binaire seul. Suffit pour les hôtes qui envoient
  # leurs logs vers un serveur central (ingest), le mode standalone et
  # les commandes de feedback (mark, templates).
  - id: tezcatl
    package_name: tezcatl
    ids: [tezcatl]
    # deb -> Debian/Ubuntu (Dokku), archlinux -> .pkg.tar.zst installable
    # avec pacman (Arch/Manjaro).
    formats:
      - deb
      - archlinux
    vendor: bornholm
    homepage: https://github.com/bornholm/tezcatl
    maintainer: William Petit <will.arcanadelirium@gmail.com>
    description: |-
      Tezcatl - observabilité intelligente et multimodale.
      Découverte de templates de logs (Drain3), détection d'anomalies
      explicables, corrélation logs/métriques/déploiements.
    bindir: /usr/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/tezcatl/README.md
      - src: misc/config/standalone.yaml
        dst: /usr/share/doc/tezcatl/standalone.yaml
      - src: misc/config/server.yaml
        dst: /usr/share/doc/tezcatl/server.yaml

  # Paquet serveur : méta-paquet sans binaire qui dépend du paquet
  # client (le binaire est unique) et ajoute l'intégration système :
  # unité systemd, configuration /etc/tezcatl, utilisateur dédié.
  - id: tezcatl-server
    package_name: tezcatl-server
    meta: true
    formats:
      - deb
      - archlinux
    vendor: bornholm
    homepage: https://github.com/bornholm/tezcatl
    maintainer: William Petit <will.arcanadelirium@gmail.com>
    description: |-
      Tezcatl - serveur d'ingestion centralisé.
      Unité systemd, configuration par défaut et utilisateur système
      pour le mode serveur de tezcatl.
    dependencies:
      - tezcatl
    contents:
      - src: misc/packaging/tezcatl-server.service
        dst: /usr/lib/systemd/system/tezcatl-server.service
        file_info: { mode: 0644 }
      - src: misc/packaging/server.yaml
        dst: /etc/tezcatl/server.yaml
        type: config|noreplace
        file_info: { mode: 0644 }
      - src: misc/packaging/server.env
        dst: /etc/tezcatl/server.env
        type: config|noreplace
        file_info: { mode: 0640 }
    scripts:
      postinstall: misc/packaging/postinstall.sh
      preremove: misc/packaging/preremove.sh
      postremove: misc/packaging/postremove.sh

  # Plugin source host : le binaire seul, installé dans le répertoire de
  # plugins standard.
  - id: tezcatl-plugin-host
    package_name: tezcatl-plugin-host
    ids: [tezcatl-source-host]
    formats:
      - deb
      - archlinux
    vendor: bornholm
    homepage: https://github.com/bornholm/tezcatl
    maintainer: William Petit <will.arcanadelirium@gmail.com>
    description: |-
      Tezcatl - plugin source host.
      Collecte des métriques du système local (CPU, mémoire, charge,
      disque) et des conteneurs Docker.
    bindir: /usr/lib/tezcatl/plugins

  # Plugin source kubernetes : pour superviser un cluster depuis un
  # hôte extérieur (kubeconfig token, kubectl proxy) ; en cluster,
  # préférer `tezcatl plugin install` dans l'image.
  - id: tezcatl-plugin-kubernetes
    package_name: tezcatl-plugin-kubernetes
    ids: [tezcatl-source-kubernetes]
    formats:
      - deb
      - archlinux
    vendor: bornholm
    homepage: https://github.com/bornholm/tezcatl
    maintainer: William Petit <will.arcanadelirium@gmail.com>
    description: |-
      Tezcatl - plugin source kubernetes.
      Events du cluster, logs de pods et changements de workloads
      (images, restarts, scaling) en continu via l'API Kubernetes.
    bindir: /usr/lib/tezcatl/plugins

  # Plugin source prometheus : requêtes PromQL périodiques.
  - id: tezcatl-plugin-prometheus
    package_name: tezcatl-plugin-prometheus
    ids: [tezcatl-source-prometheus]
    formats:
      - deb
      - archlinux
    vendor: bornholm
    homepage: https://github.com/bornholm/tezcatl
    maintainer: William Petit <will.arcanadelirium@gmail.com>
    description: |-
      Tezcatl - plugin source prometheus.
      Evaluation periodique de requetes PromQL via l'API HTTP de
      Prometheus, chaque echantillon devenant une metrique.
    bindir: /usr/lib/tezcatl/plugins

  # Intégration Dokku : une unité systemd template (une instance par
  # application) qui pipe `dokku logs -t` vers l'ingestion, et un plugin
  # Dokku déclarant chaque déploiement comme changement corrélable.
  - id: tezcatl-dokku
    package_name: tezcatl-dokku
    meta: true
    # Dokku ne vit que sur Debian/Ubuntu.
    formats:
      - deb
    vendor: bornholm
    homepage: https://github.com/bornholm/tezcatl
    maintainer: William Petit <will.arcanadelirium@gmail.com>
    description: |-
      Tezcatl - intégration Dokku.
      Unité systemd d'ingestion des logs par application
      (tezcatl-ingest@) et hook de déploiement Dokku.
    dependencies:
      - tezcatl
      - tezcatl-plugin-host
      - dokku
    contents:
      - src: misc/packaging/tezcatl-ingest@.service
        dst: /usr/lib/systemd/system/tezcatl-ingest@.service
        file_info: { mode: 0644 }
      - src: misc/packaging/tezcatl-metrics.service
        dst: /usr/lib/systemd/system/tezcatl-metrics.service
        file_info: { mode: 0644 }
      - src: misc/packaging/ingest.env
        dst: /etc/tezcatl/ingest.env
        type: config|noreplace
        file_info: { mode: 0644 }
      - src: misc/packaging/dokku/plugin.toml
        dst: /var/lib/dokku/plugins/available/tezcatl/plugin.toml
        file_info: { mode: 0644 }
      - src: misc/packaging/dokku/post-deploy
        dst: /var/lib/dokku/plugins/available/tezcatl/post-deploy
        file_info: { mode: 0755 }
    scripts:
      postinstall: misc/packaging/dokku-postinstall.sh
      preremove: misc/packaging/dokku-preremove.sh
      postremove: misc/packaging/dokku-postremove.sh

# Image de conteneur (serveur en Kubernetes, jobs one-shot ingest/mark)
# construite avec ko : pas de Dockerfile ni de daemon Docker, base
# statique distroless, publiée sur GHCR.
kos:
  - id: tezcatl
    build: tezcatl
    repositories:
      - ghcr.io/bornholm/tezcatl
    bare: true
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  name_template: "v{{ .Version }}"
